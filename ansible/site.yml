---
- name: Provision Developer Workstation
  hosts: localhost
  connection: local
  gather_facts: yes

  vars_files:
    - group_vars/all.yml

  tasks:
    - name: Include Fedora setup tasks
      ansible.builtin.include_tasks: tasks/fedora.yml
      when: ansible_facts['distribution'] == 'Fedora'

    - name: Include macOS setup tasks
      ansible.builtin.include_tasks: tasks/macos.yml
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Change Default Shell
      ansible.builtin.include_tasks: tasks/shell.yml

    - name: Install User Fonts
      ansible.builtin.include_tasks: tasks/fonts.yml

    - name: Install Starship prompt
      ansible.builtin.include_tasks: tasks/starship.yml
    
    - name: Set up Zsh plugins
      ansible.builtin.include_tasks: tasks/zsh.yml

    - name: Stow dotfiles
      ansible.builtin.include_tasks: tasks/stow.yml
