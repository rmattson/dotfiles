---
- name: Ensure DNF plugins are installed
  become: true
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Enable COPR repositories
  become: true
  community.general.copr:
    name: "{{ item }}"
    state: enabled
  loop: "{{ fedora_copr_repos }}"

- name: Install common CLI tools on Fedora
  become: true
  ansible.builtin.dnf:
    name: "{{ common_packages + fedora_specific_packages }}"
    state: present
    update_cache: yes
