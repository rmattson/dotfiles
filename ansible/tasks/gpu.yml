---
# GPU stack: NVIDIA driver (RPM Fusion nonfree) + CUDA toolkit (NVIDIA repo) +
# Miniforge with a CUDA build env. Skipped on machines without NVIDIA hardware.
- name: Detect NVIDIA hardware
  ansible.builtin.shell:
    cmd: grep -qs 0x10de /sys/bus/pci/devices/*/vendor
  changed_when: false
  failed_when: nvidia_check.rc not in [0, 1]
  register: nvidia_check

- name: Install NVIDIA GPU toolchains
  when: nvidia_check.rc == 0 and ansible_facts['os_family'] == 'RedHat'
  block:
    - name: Check if RPM Fusion nonfree is configured
      ansible.builtin.stat:
        path: /etc/yum.repos.d/rpmfusion-nonfree.repo
      register: rpmfusion_check

    - name: Add RPM Fusion repositories
      when: not rpmfusion_check.stat.exists
      block:
        - name: Download RPM Fusion release packages
          ansible.builtin.get_url:
            url: "{{ item }}"
            dest: "/tmp/{{ item | basename }}"
            mode: '0644'
          loop: "{{ rpmfusion_release_urls }}"

        - name: Install RPM Fusion release packages
          become: true
          ansible.builtin.dnf:
            name: "/tmp/{{ item | basename }}"
            state: present
            disable_gpg_check: yes # RPM Fusion's signing key is not in the rpmdb yet
          loop: "{{ rpmfusion_release_urls }}"

        - name: Clean up RPM Fusion release packages
          ansible.builtin.file:
            path: "/tmp/{{ item | basename }}"
            state: absent
          loop: "{{ rpmfusion_release_urls }}"

    # akmods builds kmod-nvidia after the transaction; load it with a reboot.
    - name: Install NVIDIA driver packages
      become: true
      ansible.builtin.dnf:
        name: "{{ nvidia_packages }}"
        state: present

    # NVIDIA lags new Fedora releases, so probe this release and the two older ones.
    # The repo directories are browsable and carry their own <keyid>.pub file.
    - name: Probe NVIDIA CUDA repositories
      ansible.builtin.uri:
        url: "https://developer.download.nvidia.com/compute/cuda/repos/fedora{{ item }}/x86_64/"
        return_content: true
      loop: "{{ cuda_repo_candidate_releases }}"
      register: cuda_repo_probe
      changed_when: false
      failed_when: false

    - name: Select the newest CUDA repository NVIDIA publishes
      ansible.builtin.set_fact:
        cuda_repo_release: >-
          {{ cuda_repo_probe.results | selectattr('status', 'equalto', 200)
             | map(attribute='item') | list | first | default('') }}
        cuda_repo_gpg_key: >-
          {{ cuda_repo_probe.results | selectattr('status', 'equalto', 200)
             | map(attribute='content') | list | first | default('')
             | regex_search('[A-F0-9]{8}\.pub') | default('73CD9B30.pub', true) }}

    - name: Add the NVIDIA CUDA repository and install the CUDA toolkit
      when: cuda_repo_release | length > 0
      block:
        - name: Add the NVIDIA CUDA repository
          become: true
          ansible.builtin.yum_repository:
            name: "cuda-fedora{{ cuda_repo_release }}"
            description: "NVIDIA CUDA repository for Fedora {{ cuda_repo_release }}"
            baseurl: "https://developer.download.nvidia.com/compute/cuda/repos/fedora{{ cuda_repo_release }}/x86_64/"
            gpgcheck: true
            gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/fedora{{ cuda_repo_release }}/x86_64/{{ cuda_repo_gpg_key }}"

        - name: Install {{ cuda_package }}
          become: true
          ansible.builtin.dnf:
            name: "{{ cuda_package }}"
            state: present

    - name: Report the missing CUDA repository
      when: cuda_repo_release | length == 0
      ansible.builtin.debug:
        msg: >-
          Skipped {{ cuda_package }}: NVIDIA publishes no CUDA repository for Fedora
          {{ ansible_facts['distribution_major_version'] }} or the older releases probed
          ({{ cuda_repo_candidate_releases | join(', ') }}).

    - name: Check if Miniforge is installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['user_dir'] }}/miniforge3/bin/mamba"
      register: miniforge_check

    - name: Install Miniforge
      when: not miniforge_check.stat.exists
      block:
        - name: Download Miniforge installer
          ansible.builtin.get_url:
            url: "{{ miniforge_installer_url }}"
            dest: /tmp/Miniforge3.sh
            mode: '0755'

        - name: Run Miniforge installer
          ansible.builtin.command:
            cmd: "bash /tmp/Miniforge3.sh -b -p {{ ansible_facts['user_dir'] }}/miniforge3"
          changed_when: true

      always:
        - name: Clean up Miniforge installer
          ansible.builtin.file:
            path: /tmp/Miniforge3.sh
            state: absent

    # shortcut: the env is reconstructed as a bare conda-forge gcc/gxx toolchain, which is
    # what cudabuild holds on artemis; add packages there if you need more.
    - name: Check if the CUDA build env exists
      ansible.builtin.stat:
        path: "{{ ansible_facts['user_dir'] }}/miniforge3/envs/{{ cuda_build_env }}"
      register: cuda_env_check

    - name: Create the CUDA build env
      when: not cuda_env_check.stat.exists
      ansible.builtin.command:
        cmd: "{{ ansible_facts['user_dir'] }}/miniforge3/bin/mamba create -y -n {{ cuda_build_env }} gcc gxx"
      changed_when: true
