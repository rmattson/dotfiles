---
- name: Ensure Zsh plugin directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.zsh"
    state: directory
    mode: '0755'

- name: Clone Zsh plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    depth: 1
    update: yes
  loop: "{{ zsh_plugins }}"
