---
# Packages with identical names across dnf and brew
common_packages:
  - curl
  - stow
  - neovim
  - helix
  - ripgrep
  - tmux
  - git
  - ghostty # Needs COPR for Fedora
  - lazygit # Needs COPR for Fedora
  - gcc
  - llvm
  - lldb
  - git-lfs
  - zsh

# Packages with OS-specific package names
fedora_specific_packages:
  - clang
  - fd-find
  - golang
  - odin-lang
  - util-linux-user
  - unzip # needed by the bun installer
  - yazi # Needs COPR for Fedora

macos_specific_packages:
  - fd
  - go
  - font-jetbrains-mono-nerd-font
  - odin

# Version/URL for Fedora RPM install
bottom_version: "0.14.6"
bottom_rpm_url: "https://github.com/ClementTsang/bottom/releases/download/{{ bottom_version }}/bottom-{{ bottom_version }}-1.x86_64.rpm"

# fedora copr repos
fedora_copr_repos:
  - scottames/ghostty
  - dejan/lazygit
  - sisyphus1813/odin-lang
  - lihaohong/yazi

# Additional installers
starship_install_script: "https://starship.rs/install.sh"

# User-level toolchains installed from upstream install scripts.
# marker: path that means it is already installed (checked with stat)
cli_installers:
  - name: bun
    marker: "{{ ansible_facts['user_dir'] }}/.bun/bin/bun"
    installer: "curl -fsSL https://bun.sh/install | bash"
  - name: pixi
    marker: "{{ ansible_facts['user_dir'] }}/.pixi/bin/pixi"
    installer: "curl -fsSL https://pixi.sh/install.sh | sh"
  - name: opencode
    marker: "{{ ansible_facts['user_dir'] }}/.opencode/bin/opencode"
    installer: "curl -fsSL https://opencode.ai/install | bash"

# GPU stack (tasks/gpu.yml only runs it when an NVIDIA GPU is present)
rpmfusion_release_urls:
  - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
  - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
nvidia_packages:
  - akmod-nvidia
  - xorg-x11-drv-nvidia-cuda

# NVIDIA ships CUDA repos only for some Fedora releases (there is no fedora45 as of
# 2026-11), so probe this release first and fall back to the newest older one.
cuda_package: cuda-toolkit
cuda_repo_candidate_releases: "{{ range(ansible_facts['distribution_major_version'] | int, (ansible_facts['distribution_major_version'] | int) - 3, -1) | map('string') | list }}"
miniforge_installer_url: "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh"
cuda_build_env: cudabuild

# Dotfile packages to stow
stow_packages:
  - nvim
  - helix
  - zsh
  - tmux
  - ghostty

# Zsh plugins
zsh_plugins:
  - name: zsh-autosuggestions
    repo: "https://github.com/zsh-users/zsh-autosuggestions.git"
    dest: "{{ ansible_facts['user_dir'] }}/.zsh/zsh-autosuggestions"

  - name: zsh-syntax-highlighting
    repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    dest: "{{ ansible_facts['user_dir'] }}/.zsh/zsh-syntax-highlighting"
