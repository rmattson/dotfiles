# Settings for reinstalling a headless Fedora server over SSH. Sourced by reinstall-fedora.sh.

# Install media: Fedora 44 Server netinst. It is only used to borrow the installer kernel and
# initrd; the packages come from install_repo below. (checksum from Fedora-Server-44-1.7-x86_64-CHECKSUM)
iso_url="https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Server/x86_64/iso/Fedora-Server-netinst-x86_64-44-1.7.iso"
iso_sha256="ae20c06bea746913cadea7d80463e13f4bf55bee4df2918111c921c674b70283"
install_repo="https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Server/x86_64/os"

# The account you log in as afterwards. The password is asked for at run time and only its
# SHA-512 hash goes into the generated kickstart; export user_password=... to skip the prompt.
username=ryan
groups=wheel
ssh_pubkey=            # empty = read id_ed25519.pub from the home of the user who ran sudo

hostname=              # empty = keep the machine's current hostname
timezone=              # empty = keep the machine's current timezone
language=en_US.UTF-8
keyboard=us

# What gets installed: the comps environment id for "Fedora Server Edition" in the Server repo.
comps_environment=server-product-environment

# Fedora picks the Server default layout with no options. Quote the value when you set it,
# e.g. autopart_extra="--type=btrfs --encrypted" (also: lvm, thinp, plain, --nohome).
autopart_extra=

# Extra kernel arguments for the installer entry, e.g. extra_args="console=ttyS0,115200n8"
# for a serial console, or extra_args="inst.text" to force Anaconda's text mode.
extra_args=

ks_out=/boot/f44-server.ks
